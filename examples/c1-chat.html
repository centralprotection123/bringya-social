<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Inter,sans-serif;background:#DDFB33;color:#0B1B4D;position:relative;overflow:hidden}
.chat{position:absolute;left:80px;right:80px;top:90px;background:#fff;border-radius:56px;padding:44px 40px 50px;box-shadow:0 30px 0 #0B1B4D}
.top{display:flex;align-items:center;gap:20px;padding-bottom:28px;border-bottom:2px solid #E3EAFF;margin-bottom:34px}
.av{width:76px;height:76px;border-radius:50%;background:#154CFE;color:#DDFB33;font-weight:900;font-size:36px;display:flex;align-items:center;justify-content:center}
.who b{display:block;font-size:36px;font-weight:800}.who span{font-size:22px;color:#6B7AA6}
.b{max-width:700px;padding:26px 34px;border-radius:38px;font-size:39px;line-height:1.3;margin:14px 0;font-weight:500}
.them{background:#EEF2FF;border-bottom-left-radius:10px}
.me{background:#154CFE;color:#fff;margin-left:auto;border-bottom-right-radius:10px}
.pin{display:inline-block;background:#DDFB33;color:#0B1B4D;font-weight:900;padding:0 10px;border-radius:10px;letter-spacing:.08em}
.time{text-align:center;font-size:24px;color:#9AA6C8;margin:22px 0 6px}
.foot{position:absolute;left:80px;right:80px;bottom:70px;display:flex;align-items:flex-end;justify-content:space-between}
.line{font-size:50px;font-weight:900;line-height:1.05;letter-spacing:-.03em;width:640px}
.logo{height:62px}
</style></head><body>
<div class="chat" data-qa="mock">
 <div class="top"><div class="av">M</div><div class="who"><b>Mom</b><span>online</span></div></div>
 <div class="b them">Your lunch is still on the counter 🙃</div>
 <div class="b me">noooo. I'm already at work</div>
 <div class="b them">Relax. I booked a BringYa. You can watch the rider on the map.</div>
 <div class="time">12 minutes later</div>
 <div class="b them">Rider says the PIN is <span class="pin">4827</span></div>
 <div class="b me">got it 😭 you're the best</div>
</div>
<div class="foot"><div class="line" data-qa="text">Every family has a "you forgot it" story.</div><img class="logo" src="../brand/bringya-logo.png"></div>
</body></html>
