<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Inter,sans-serif;background:#F4F7FF;color:#0B1B4D;position:relative;overflow:hidden}
.bg{position:absolute;right:-200px;top:180px;width:900px;height:900px;border-radius:50%;background:#154CFE}
h1{position:absolute;left:70px;top:80px;width:600px;font-size:80px;font-weight:900;line-height:1;letter-spacing:-.04em}
.phone{position:absolute;left:430px;top:300px;width:460px;height:auto;background:#0B1B4D;border-radius:64px;padding:16px;box-shadow:0 50px 90px rgba(11,27,77,.35)}
.phone img{width:100%;height:auto;border-radius:48px;display:block}
.note{position:absolute;background:#DDFB33;color:#0B1B4D;font-weight:800;font-size:30px;line-height:1.15;padding:22px 26px;border-radius:20px;box-shadow:0 14px 30px rgba(11,27,77,.25)}
.n1{left:70px;top:640px;width:330px;transform:rotate(-4deg)}
.n2{left:70px;top:900px;width:330px;transform:rotate(3deg);background:#fff}
.arrow{position:absolute;inset:0;pointer-events:none}
.foot{position:absolute;left:70px;bottom:60px;display:flex;gap:30px;align-items:center}
.logo{height:60px}
.url{font-size:30px;font-weight:800;color:#0B1B4D}
</style></head><body>
<div class="bg"></div>
<h1 data-qa="text">Your shop could be right here.</h1>
<div class="phone" data-qa="mock"><img src="../brand/screens/customer-home.png"></div>
<svg class="arrow" viewBox="0 0 1080 1350"><path d="M402 700 C 430 690, 445 680, 478 672" fill="none" stroke="#0B1B4D" stroke-width="6" stroke-linecap="round"/><path d="M458 660 L480 671 L462 688" fill="none" stroke="#0B1B4D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M402 975 C 520 1000, 610 990, 690 940" fill="none" stroke="#0B1B4D" stroke-width="6" stroke-linecap="round"/><path d="M666 938 L692 938 L682 962" fill="none" stroke="#0B1B4D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="note n1" data-qa="text">"Sell on BringYa" brings shops like yours on board</div>
<div class="note n2" data-qa="text">Locals browse BringYa Shops and order same day</div>
<div class="foot"><img class="logo" src="../brand/bringya-logo.png"><span class="url" data-qa="text">bringya.ca/business</span></div>
</body></html>
