<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Inter,sans-serif;background:#DDFB33;color:#0B1B4D;position:relative;overflow:hidden}
.lock{position:absolute;left:130px;top:90px;width:820px;height:auto;border-radius:84px;background:linear-gradient(170deg,#154CFE 0%,#0B1B4D 100%);box-shadow:0 40px 0 #0B1B4D;padding:80px 46px 60px}
.time{color:#fff;text-align:center;font-weight:300;font-size:170px;letter-spacing:-.04em;line-height:1}
.date{color:#B9C6EE;text-align:center;font-size:30px;font-weight:600;margin:10px 0 60px}
.n{background:rgba(255,255,255,.94);border-radius:34px;padding:24px 28px;display:flex;gap:22px;align-items:flex-start;margin-bottom:18px}
.n.dim{opacity:.86;transform:scale(.97)}
.ic{flex:0 0 74px;height:74px;border-radius:20px;background:#fff;border:2px solid #E3EAFF;display:flex;align-items:center;justify-content:center}
.ic img{width:58px;height:auto}
.tx{flex:1}
.top{display:flex;justify-content:space-between;font-size:22px;font-weight:700;color:#6B7AA6;margin-bottom:6px}
.msg{font-size:32px;font-weight:600;line-height:1.28}
.msg b{font-weight:800}
.pin{display:inline-block;background:#DDFB33;padding:0 10px;border-radius:8px;font-weight:900;letter-spacing:.08em}
.cap{position:absolute;left:90px;right:90px;bottom:70px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.line{font-size:68px;font-weight:900;line-height:1.02;letter-spacing:-.035em;width:700px}
.url{font-size:28px;font-weight:800;padding-bottom:8px}
</style></head><body>
<div class="lock" data-qa="mock">
 <div class="time">5:42</div>
 <div class="date">Friday</div>
 <div class="n dim"><div class="ic"><img src="../../brand/bringya-icon.png"></div><div class="tx"><div class="top"><span>BringYa</span><span>4:58 PM</span></div><div class="msg">Rider picked up the birthday gift 🎁</div></div></div>
 <div class="n dim"><div class="ic"><img src="../../brand/bringya-icon.png"></div><div class="tx"><div class="top"><span>BringYa</span><span>5:31 PM</span></div><div class="msg">Rider is 6 min away from Maya's door</div></div></div>
 <div class="n"><div class="ic"><img src="../../brand/bringya-icon.png"></div><div class="tx"><div class="top"><span>BringYa</span><span>now</span></div><div class="msg"><b>Delivered.</b> Maya confirmed with PIN <span class="pin">4827</span> ✓</div></div></div>
</div>
<div class="cap"><div class="line" data-qa="text">Couldn't make the party. The gift did.</div><div class="url" data-qa="text">bringya.ca</div></div>
</body></html>
