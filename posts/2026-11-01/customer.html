<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Inter,sans-serif;background:#0B1B4D;color:#0B1B4D;position:relative;overflow:hidden}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2px);background-size:36px 36px}
.note{position:absolute;left:110px;top:110px;width:860px;background:#DDFB33;border-radius:10px;padding:100px 72px 80px;transform:rotate(-2.5deg);box-shadow:0 40px 70px rgba(0,0,0,.45)}
.tape{position:absolute;top:-26px;left:50%;width:220px;height:56px;margin-left:-110px;background:rgba(255,255,255,.55);transform:rotate(3deg)}
.title{font-size:76px;font-weight:900;letter-spacing:-.03em;margin-bottom:40px}
.item{display:flex;align-items:center;gap:28px;padding:30px 0;border-bottom:3px solid rgba(11,27,77,.15)}
.box{flex:0 0 52px;height:52px;border:5px solid #0B1B4D;border-radius:12px;position:relative}
.box:after{content:"";position:absolute;left:12px;top:2px;width:14px;height:28px;border:solid #154CFE;border-width:0 7px 7px 0;transform:rotate(40deg)}
.txt{font-size:44px;font-weight:700;line-height:1.2}
.txt s{text-decoration-thickness:3px;text-decoration-color:rgba(11,27,77,.55)}
.txt small{display:block;font-size:28px;font-weight:600;color:#154CFE;margin-top:4px}
.last .txt{font-weight:900}
.cap{position:absolute;left:90px;right:90px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.line{color:#fff;font-size:68px;font-weight:900;line-height:1.02;letter-spacing:-.035em;width:680px}
.line span{color:#DDFB33}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.badge{background:#fff;border-radius:22px;padding:12px 20px}.badge img{height:44px;display:block}
.url{color:#fff;font-size:28px;font-weight:800}
</style></head><body>
<div class="dots"></div>
<div class="note" data-qa="mock">
 <div class="tape"></div>
 <div class="title">Sunday to-do</div>
 <div class="item"><div class="box"></div><div class="txt"><s>Groceries run</s><small>Ordered from a local shop on BringYa</small></div></div>
 <div class="item"><div class="box"></div><div class="txt"><s>Return Sam's charger</s><small>Sent across town, tracked live</small></div></div>
 <div class="item"><div class="box"></div><div class="txt"><s>Gift for Nana's birthday</s><small>Handed over with a delivery PIN</small></div></div>
 <div class="item last" style="border-bottom:0"><div class="box"></div><div class="txt">Actually rest</div></div>
</div>
<div class="cap"><div class="line" data-qa="text">Errands done. <span>Couch not left.</span></div><div class="right"><div class="badge"><img src="../../brand/bringya-logo.png"></div><span class="url" data-qa="text">bringya.ca</span></div></div>
</body></html>
